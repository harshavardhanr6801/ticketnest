spring:
  application:
    name: ticketnest

  datasource:
    url: jdbc:mariadb://localhost:3307/ticketnest
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
