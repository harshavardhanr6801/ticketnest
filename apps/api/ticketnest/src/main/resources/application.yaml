spring:
  application:
    name: ticketnest

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mariadb://localhost:3307/ticketnest
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate


  flyway:
    enabled: true
    locations: classpath:db/migration
